[package]
name = "pixelmap-multiview-py"
version = "0.1.1"
edition = "2021"
rust-version = "1.83"
description = "Python bindings for the pixelmap_multiview crate"
license = "MIT"
# The distribution goes to PyPI, not crates.io. The name here only has to avoid
# clashing with the `pixelmap_multiview` dependency below; the name users see is set in
# pyproject.toml.
publish = false

[lib]
name = "_pixelmap_multiview"
crate-type = ["cdylib"]

[dependencies]
# `pixelmap` and `nalgebra` are reached through this crate's re-exports, so they are
# always the versions it was built against.
pixelmap_multiview = "0.1.1"
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
numpy = "0.29"
# The crate does no I/O, so encoding the texture atlas is ours to do.
png = "0.17"

[profile.release]
# This repo is its own workspace root, so it does not inherit the crate's tuned
# release profile. Without these the solver's hot path loses cross-crate inlining.
lto = "fat"
codegen-units = 1
