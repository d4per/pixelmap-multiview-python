name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The wheels are abi3, so one build serves every version. Testing the oldest and
        # the newest is what checks that claim; the ones in between add nothing.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install pytest numpy pillow
      # `pip install .` rather than `maturin develop`: a runner has no virtualenv for
      # develop to install into, and this is the path a user actually takes. pip fetches
      # maturin itself from the build-system requires, and the backend compiles in release
      # mode — which matters, because the tests run whole reconstructions and a debug
      # build takes many minutes rather than twenty seconds.
      - run: pip install .
      - run: pytest -v

  lint:
    name: fmt + clippy + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # A tagged release publishes the sdist too, so it has to be installable from source on
  # a machine with nothing but a Rust toolchain.
  sdist:
    name: build and install sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin
      - run: maturin sdist --out dist
      - run: pip install --no-binary pixelmap-multiview-python dist/*.tar.gz
      - run: python -c "import pixelmap_multiview as m; print(m.__version__, m.MIN_VIEWS)"
